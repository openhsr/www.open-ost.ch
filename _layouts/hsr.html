---
layout: default
---
{% include header.html %}

<section id="content">
  <main role="main" class="wiki-content">
    <section>
      <h1>{{ page.title }}</h1>
      <article>
        {{ content }}
      </article>

    </section>

    <a href=https://www.github.com/{{ site.github_username }}/{{ site.git_repo }}/edit/master/{{ page.path }} class="edit-on-github button">
      <span class="">
        <i class="fa fa-github"></i>
      </span>
      Seite bearbeiten!
    </a>
  </main>

  <aside id="sidebar">

    {% include nav_toc.html %}

    <div class="cross-references">
      {% include nav_app.html %}

      {% include nav_hsr.html %}

      {% include nav_events.html%}
    </div>

  </aside>
</section>

{% include footer.html %}
